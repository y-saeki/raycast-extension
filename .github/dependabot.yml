version: 2
updates:
  - package-ecosystem: npm
    directory: /url-cleaner
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Patch and minor bumps land as one PR so routine updates do not flood the queue.
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
